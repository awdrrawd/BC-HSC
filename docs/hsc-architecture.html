<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSC 架構與功能分支圖</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#f7f5fb;--surface:#fff;--surface-2:#f1edf8;--line:#b9aed0;--text:#1d1830;--muted:#6b6381;
  --brand:#c2417d;--brand-2:#7c5cff;--ring:rgba(118,72,254,.35);--shadow:0 1px 2px rgba(40,20,80,.06),0 8px 24px rgba(40,20,80,.06);
  --boot:#2f9e6b;--front:#0e93a6;--logic:#7c5cff;--data:#d98a12;--net:#4f7cf0;--bc:#d6455d;--verify:#8a7f9c;
  --code-bg:#f1edf8;--code-fg:#4a2f8f;--border:#e3dcef;
}
:root[data-theme="dark"]{
  --bg:#0d0b11;--surface:#17131e;--surface-2:#211b2a;--line:#665778;--text:#f5f1fa;--muted:#a89fbd;
  --brand:#f06aa5;--brand-2:#a58bff;--ring:rgba(165,139,255,.4);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --boot:#5ed49b;--front:#52d0dd;--logic:#a58bff;--data:#f0b44c;--net:#7da2ff;--bc:#ff7a8d;--verify:#b3a8c6;
  --code-bg:#251c38;--code-fg:#dccbff;--border:#352e40;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0b11;--surface:#17131e;--surface-2:#211b2a;--line:#665778;--text:#f5f1fa;--muted:#a89fbd;
    --brand:#f06aa5;--brand-2:#a58bff;--ring:rgba(165,139,255,.4);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --boot:#5ed49b;--front:#52d0dd;--logic:#a58bff;--data:#f0b44c;--net:#7da2ff;--bc:#ff7a8d;--verify:#b3a8c6;
    --code-bg:#251c38;--code-fg:#dccbff;--border:#352e40;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(800px 380px at 85% -5%,color-mix(in srgb,var(--brand) 16%,transparent),transparent 70%),radial-gradient(600px 300px at 5% 0,color-mix(in srgb,var(--brand-2) 10%,transparent),transparent 70%)}
a{color:inherit}
code,.file{font-family:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace}
button:focus-visible,a:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px clamp(16px,4vw,40px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit;padding:0}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-style:normal;font-size:16px}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:40px;padding:0 44px 0 40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;outline:none;transition:box-shadow .15s,border-color .15s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.search svg{position:absolute;left:13px;top:11px;width:18px;height:18px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:9px;padding:1px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font:12px/20px ui-monospace,monospace}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:transform .15s,border-color .15s}
.icon-btn:hover{border-color:var(--brand);transform:translateY(-1px)}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;max-width:1440px;margin:0 auto;padding:26px clamp(16px,4vw,40px) 60px}
.side{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;display:grid;gap:2px;font-size:14px;padding-right:4px}
.side h4{margin:14px 0 4px 12px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.side h4:first-child{margin-top:0}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font:inherit;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.side button span{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.6}
.side button:hover{background:var(--surface-2);color:var(--text)}
.side button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.side button.active span{opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}

h1{margin:0 0 8px;font-size:clamp(28px,4vw,42px);line-height:1.15;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;color:var(--muted);max-width:760px;font-size:16px}
h2.sub{margin:30px 0 10px;font-size:15px;color:var(--muted);letter-spacing:.04em}

/* 依賴管線 */
.pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 14px}
.pnode{flex:1 0 170px;position:relative;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--c);box-shadow:var(--shadow)}
.pnode b{display:block;color:var(--c);font-size:13px;margin-bottom:2px}
.pnode small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.parrow{flex:0 0 34px;display:grid;place-items:center;color:var(--line);font-size:20px}
.pnote{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.pnote b{color:var(--text)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-align:left;color:inherit;font:inherit;cursor:pointer;transition:transform .18s,border-color .18s}
.tile:hover{transform:translateY(-3px);border-color:var(--brand)}
.tile h3{margin:0;font-size:16px}
.tile p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.layers{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:8px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.tile.hide{display:none}

/* 線性樹 */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.crumb button{border:0;background:none;color:var(--brand);font:inherit;cursor:pointer;padding:0}
.detail h2{margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
.detail .lead{margin-bottom:20px}
.tree{overflow:auto;padding:28px 26px;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.bundle{display:grid;grid-template-columns:190px minmax(0,1fr);gap:56px;align-items:center;min-width:860px}
.root{position:relative;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--brand) 9%,var(--surface-2));border:1px solid color-mix(in srgb,var(--brand) 65%,var(--border));color:var(--text);font-weight:700;line-height:1.35;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent),0 0 20px color-mix(in srgb,var(--brand) 30%,transparent)}
.root::after{content:"";position:absolute;left:100%;top:50%;width:28px;border-top:2px solid var(--line)}
.rows{display:flex;flex-direction:column}
.row{position:relative;display:grid;grid-template-columns:270px minmax(0,1fr);gap:50px;align-items:center;padding:7px 0}
.row::before{content:"";position:absolute;left:-28px;top:50%;width:28px;border-top:2px solid var(--line)}
.row::after,.down::before{content:"";position:absolute;left:-28px;top:0;bottom:0;border-left:2px solid var(--line)}
.row:first-child::after{top:50%}
.row:last-child::after{bottom:50%}
.row:only-child::after{display:none}
.branch{position:relative;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--c)}
.branch{transition:box-shadow .2s}
.branch:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 28%,transparent),0 0 16px color-mix(in srgb,var(--c) 28%,transparent)}
.branch::after{content:"";position:absolute;left:100%;top:50%;width:50px;border-top:2px solid var(--line)}
.branch .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14.5px}
.branch p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.copy{margin-left:auto;padding:1px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:11.5px/1.6 inherit;cursor:pointer}
.copy:hover{color:var(--text);border-color:var(--brand)}
.files{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.files::before{content:"";position:absolute;left:-12px;top:50%;border:6px solid transparent;border-left:9px solid var(--line);border-right:0;transform:translateY(-50%)}
.file{padding:4px 10px;border-radius:8px;background:var(--code-bg);color:var(--code-fg);font-size:12.5px;text-decoration:none;overflow-wrap:anywhere;border:1px solid transparent;transition:border-color .15s}
.file:hover{border-color:var(--brand);text-decoration:underline}
.down{position:relative;width:270px;height:24px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.down span{padding:0 8px;background:var(--surface);position:relative;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:14px 2px 0;color:var(--muted);font-size:12.5px;align-items:center}

.empty{display:none;padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;margin-top:14px}
.empty.show{display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);padding:9px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{padding:26px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}

@media (max-width:900px){
  .shell{display:block}
  .side{position:sticky;top:65px;z-index:10;display:flex;max-height:none;overflow-x:auto;gap:6px;margin:0 -16px 20px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .side h4{display:none}
  .side button{width:auto;white-space:nowrap;border:1px solid var(--border);background:var(--surface)}
  .brand b{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="home" type="button" title="回到總覽"><i>🌀</i><b>HSC 架構與功能分支圖</b></button>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜尋功能、模組或檔案…" autocomplete="off" aria-label="搜尋">
    <kbd>/</kbd>
  </label>
  <button class="icon-btn" id="theme" type="button" aria-label="切換深淺色" title="切換深淺色">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="side" id="nav" aria-label="功能分支"></nav>
  <main id="main"></main>
</div>
<footer>功能資料位於本檔 <code>features</code> 陣列；改檔名或刪模組後請同步更新。完整說明見 <a href="https://github.com/awdrrawd/BC-HSC/blob/main/docs/architecture.md">architecture.md</a></footer>
<div class="toast" id="toast" role="status"></div>

<script>
const features=[
 ['啟動與公開 API','main.js 沒有靜態 import，先同步佔用 window.Liko.HSC 再動態載入 app.js；app.js 註冊公開 API 後呼叫 initialize()。主程式與 loader 版本獨立，主程式版本號來自 package.json。',[['Bootstrap','防重複佔位與動態載入','main.js'],['App','公開 API 與入口','app.js'],['Init','等待 SDK、登入、設定，再安裝 Hooks 與卸載','core/core-init.js'],['Build','bootstrap 與應用兩個 chunk','../vite.config.js'],['Loader','正式與本機載入器','../loader.user.js,../loader.local.user.js']]],
 ['BC Hooks 與相容','Hook 分散在負責功能的模組內，共 20 個 BC 函式列入相容基準（R133）；掛鉤前先確認函式存在。每週比對 BC 原始碼雜湊並以 issue 通知。',[['Hooks','繪製、氛圍、座標錨點、高潮','core/hooks.js'],['Screen Guard','離開聊天室時清暫態效果','core/core-init.js'],['Checker','雜湊與存在性檢查','../scripts/check-bc-compat.mjs,../scripts/bc-compat-issue.mjs'],['Baseline','R133 函式雜湊基準','../scripts/bc-compat-baseline.json'],['Workflow','每週比對','../.github/workflows/bc-compat.yml'],['Tests','檢查器測試','../scripts/test-bc-compat.mjs'],['Docs','相容追蹤說明','../docs/automation.md']]],
 ['設定與儲存','設定存 ExtensionSettings（LZString 壓縮，5 KB 警戒線），公告副本放 OnlineSharedSettings.HSC；本機備份依帳號分開，大量文本與上傳音檔存 IndexedDB liko-hsc。',[['Defaults','預設設定與常數','core/config.js'],['Data','深合併、驗證與舊版遷移','core/settings-data.js'],['Storage','讀寫、備份、匯出入、公告','core/storage.js'],['Tests','設定往返與遷移','../scripts/test-settings.mjs']]],
 ['語音觸發流程','以 MutationObserver 監看聊天紀錄偵測 [Voice] 與觸發詞（不是 hook ChatRoomMessage）；HSC 自己輸出的訊息帶標記而被略過；白名單驗證後交給效果流程。',[['Observer','聊天節點解析與白名單展開','ui/panel.js'],['Command','/hsc 指令','core/commands.js'],['Util','觸發入口與強度計算','util/util.js'],['Runner','只在聊天室內組合效果','effects/run.js'],['Tests','[Voice] 偽造與白名單隱私','../scripts/test-security.mjs']]],
 ['視覺效果','螺旋、電波、暗角、扭曲與粉紅暈染；催眠氛圍透過 Player.GetBlurLevel／GetTints 交給 BC 原生繪製管線，其餘效果掛在 #hsc-overlay，層級集中宣告。',[['Overlay','圖層順序宣告','util/zlayers.js'],['Geometry','畫布常數與幾何','util/geometry.js'],['Spiral','螺旋與電波','effects/spiral.js,effects/waves.js'],['Screen','暗角、扭曲與粉紅暈染','effects/vignette.js,effects/distort.js,effects/pink-flash.js'],['Atmosphere','模糊與淡紫染色','effects/atmosphere.js']]],
 ['角色、表情與高潮','表情切換（最多 10 組，含 WCE 眼睛組）、喘息、彈幕與高潮特效；每個效果只釋放自己的表情，原始快取最後一次還原才清除。',[['Character','表情套用與還原','effects/character-fx.js'],['State','表情唯讀快照與權杖','effects/expression-state.js'],['Breath','喘息粒子','effects/breath.js'],['Danmaku','彈幕文字','effects/danmaku.js,util/text.js'],['Climax','快照碎裂與紅白閃','effects/climax.js'],['Tests','表情回歸','../scripts/test-expressions.mjs']]],
 ['日常干擾','不需觸發詞，依間隔（1–99 分鐘）循環播放輕度催眠效果；每項可單獨開關。取消以世代識別使既有工作失效。',[['Loop','日常干擾循環','effects/depth.js'],['Lifecycle','世代式取消與清理','effects/lifecycle.js'],['Tests','取消、清理與中斷後續','../scripts/test-lifecycle.mjs']]],
 ['催眠狀態（強控）','催眠值 0–100，滿值進入時間制強控；清醒倒數、延長、清醒詞與 /hsc wake。強控效果包含符咒、識別障礙、人群、訊息妨礙與說話攔截，進度經公告供他人在頭上顯示。',[['State','催眠值與強控狀態機','hypno/hypno.js'],['Speech','說話攔截（四選一）','hypno/hypno-speech.js'],['Animation','符咒儀式動畫','hypno/hypno-anim.js'],['Orb','頭上進度球與符咒','hypno/hypno-orb.js'],['Effects','彈幕、訊息煙霧與干擾','effects/state-fx.js'],['Censor','面部與名稱識別障礙','effects/censor.js'],['Crowd','圍觀人群','effects/crowd.js'],['Docs','儀式座標系原則','../docs/ritual-coordinates.md']]],
 ['聲音','催眠、高潮、深度、語音四類音效庫；可用預設音源或上傳本機音檔（IndexedDB），預載後才播放。',[['Player','預載、快取與播放','effects/sound.js'],['Storage','音效設定與本機檔','core/storage.js'],['UI','聲音分頁','ui/preference.js']]],
 ['控制面板與偏好設定','聊天室快速控制面板、BC 偏好設定頁（基本、效果、文本、表情、聲音、關於）與統一排版。',[['Panel','聊天室控制面板','ui/panel.js'],['Preference','偏好設定頁與遠端分頁','ui/preference.js'],['Layout','列高、列距與分組間距','ui/preference-layout.js'],['Style','CSS','ui/styles.js'],['Icons','按鈕圖示與主題色取樣','util/icons.js'],['Tests','排版與白名單按鈕','../scripts/test-preference-layout.mjs']]],
 ['個人資料頁遠端編輯','在他人個人資料頁以 HSC 按鈕編輯其允許的文本；編輯經 Hidden 訊息送出並由對方驗證權限後套用。使用獨立畫面 HSC_ProfileEdit，不與其他 mod 比優先權。',[['Profile','按鈕、獨立畫面與權限','ui/profile.js'],['Queue','隱藏訊息間隔佇列與去重','core/net.js'],['Screen','畫面常數','core/config.js'],['Tests','遠端輸入上限與隱私','../scripts/test-security.mjs'],['Docs','獨立畫面實作筆記','../docs/standalone-screen.md']]],
 ['多語系','11 語系字庫一國一檔，各含 UI 與聊天在地化兩套；共用引擎於執行期載入，未就緒時退回內建中文。聊天在地化送英文底本加標記，接收端改寫。',[['UI','UI 字串與語系選擇','expansion/i18n.js'],['L10N','聊天在地化送出','expansion/l10n.js'],['Engine','共用引擎（執行期 fetch）','expansion/BC_i18n.js'],['Dictionary','字庫來源','../Translation/EN.js,../Translation/TW.js'],['Studio','翻譯編輯器','../Translation/index.html'],['Tests','鍵與佔位符一致','../scripts/check-translations.mjs']]],
 ['驗證與部署','CI 依序 lint、測試、audit、建置；通過後部署 Pages 並檢查已發布資產。素材與翻譯由 copy-assets 複製到 public/。',[['Assets','素材與翻譯複製、架構圖發布','../scripts/copy-assets.mjs'],['CI','HSC checks','../.github/workflows/ci.yml'],['Deploy','建置、部署與發布後檢查','../.github/workflows/deploy.yml,../scripts/check-deployment.mjs'],['Guide','指令與 GitHub 設定','../docs/automation.md'],['Todo','待驗收項目','../docs/verification.md']]]
];
let active=features[0];
const groupOf=['核心','核心','核心','催眠與效果','催眠與效果','催眠與效果','催眠與效果','催眠與效果','催眠與效果','介面與編輯','介面與編輯','翻譯與維護','翻譯與維護'];
const LAYERS={boot:{n:'啟動',r:0,c:'--boot'},front:{n:'前端 UI',r:1,c:'--front'},logic:{n:'功能／效果',r:2,c:'--logic'},data:{n:'資料',r:3,c:'--data'},net:{n:'通訊',r:4,c:'--net'},bc:{n:'BC 邊界',r:5,c:'--bc'},verify:{n:'驗證／文件',r:6,c:'--verify'}};
const PIPE=[
 ['玩家操作','boot','聊天室輸入與 [Voice]、個人資料頁、偏好設定、/hsc 指令'],
 ['前端 UI','front','ui/ 的控制面板、偏好設定頁、個人資料頁遠端編輯'],
 ['功能／效果','logic','effects/ · hypno/ · expansion/ · util/ · core/commands.js'],
 ['資料','data','core/ 的 config、settings-data、storage · ExtensionSettings · IndexedDB liko-hsc'],
 ['通訊','net','core/net.js 隱藏訊息佇列（HSC_PermQuery、SetTexts、Hypnotized…）· OnlineSharedSettings.HSC'],
 ['BC 邊界','bc','Hook BC 函式（基準 R133 共 20 個），分散在 core/ effects/ hypno/ ui/'],
 ['遊戲與其他玩家','verify','BC 伺服器、房內其他 HSC 玩家']
];

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const nav=$('#nav'),main=$('#main'),q=$('#q');
const state={view:'overview',query:''};
const REPO='https://github.com/awdrrawd/BC-HSC/blob/main/';
const pathOf=file=>file.startsWith('../')?file.slice(3):'src/'+file;
const layerOf=files=>{
  const p=pathOf(files.split(',')[0]);
  if(!p.startsWith('src/'))return 'verify';
  const s=p.slice(4);
  if(s==='main.js'||s==='app.js'||s==='core/core-init.js')return 'boot';
  if(s==='core/hooks.js')return 'bc';
  if(s==='core/net.js')return 'net';
  if(s.startsWith('ui/'))return 'front';
  if(s==='core/config.js'||s==='core/settings-data.js'||s==='core/storage.js')return 'data';
  return 'logic';
};
const branchesOf=f=>f[2].map((b,k)=>({b,k,layer:layerOf(b[2])})).sort((x,y)=>LAYERS[x.layer].r-LAYERS[y.layer].r||x.k-y.k);
const layersOf=f=>[...new Set(branchesOf(f).map(x=>x.layer))];
const groupColor=g=>({'核心':'--boot','催眠與效果':'--logic','介面與編輯':'--front','翻譯與維護':'--verify'}[g]);
const matches=(f,qs)=>!qs||JSON.stringify(f).toLowerCase().includes(qs);

function renderNav(){
  const qs=state.query.trim().toLowerCase();nav.replaceChildren();let last='';
  features.forEach((f,i)=>{
    if(!matches(f,qs))return;
    if(groupOf[i]!==last){last=groupOf[i];nav.append(el('h4',null,last))}
    const b=el('button',f===active&&state.view==='feature'?'active':'');b.type='button';b.style.setProperty('--c','var('+groupColor(groupOf[i])+')');
    b.append(el('span'),document.createTextNode(f[0]));b.addEventListener('click',()=>open(i));nav.append(b);
  });
}
function pipeline(){
  const wrap=el('div','pipe');
  PIPE.forEach(([t,l,d],i)=>{
    if(i)wrap.append(el('div','parrow','→'));
    const n=el('div','pnode');n.style.setProperty('--c','var('+LAYERS[l].c+')');n.append(el('b',null,t),el('small',null,d));wrap.append(n);
  });
  return wrap;
}
function renderOverview(){
  const qs=state.query.trim().toLowerCase();main.replaceChildren();
  const h=el('h1');h.append(document.createTextNode('HSC 架構與功能分支圖'),document.createElement('br'),el('em','','依賴由前端到後端'));
  main.append(h,el('p','lead','[Voice] 觸發的催眠效果、催眠狀態與個人資料頁遠端編輯的模組邊界。上方是整體呼叫方向；選擇功能後，樹狀圖依「前端 → 功能／效果 → 資料 → 通訊 → BC 邊界」排列模組與實際檔案，點擊檔案可開啟原始碼。'));
  main.append(el('h2','sub','整體呼叫方向'),pipeline());
  const note=el('p','pnote');note.append(document.createTextNode('反向路徑：'),el('b',null,'BC 事件'),document.createTextNode(' 分散在各模組的 Hook 進入；語音觸發由 ui/panel.js 的 MutationObserver 監看聊天紀錄，而 HSC_* 隱藏訊息由 ui/profile.js 的 ChatRoomMessage Hook 接收並驗證權限後套用。'));
  main.append(note,el('h2','sub','功能分支'));
  const grid=el('div','grid');let shown=0;
  features.forEach((f,i)=>{
    if(!matches(f,qs))return;shown++;
    const t=el('button','tile');t.type='button';t.append(el('h3',null,f[0]),el('p',null,f[1]));
    const ls=el('div','layers');for(const l of layersOf(f)){const b=el('span','badge',LAYERS[l].n);b.style.setProperty('--c','var('+LAYERS[l].c+')');ls.append(b)}
    t.append(ls);t.addEventListener('click',()=>open(i));grid.append(t);
  });
  main.append(grid,el('div','empty'+(shown?'':' show'),'找不到符合的項目，試試其他關鍵字。'));
}
function renderFeature(){
  const i=features.indexOf(active),f=active;main.replaceChildren();
  const crumb=el('div','crumb');const back=el('button',null,'← 總覽');back.type='button';back.addEventListener('click',()=>{state.view='overview';render()});
  crumb.append(back,document.createTextNode('/ '+groupOf[i]));
  const d=el('section','detail');d.append(el('h2',null,f[0]),el('p','lead',f[1]));
  const tree=el('div','tree'),bundle=el('div','bundle');
  bundle.append(el('div','root',f[0]));
  const rows=el('div','rows');let prev=null;
  for(const {b,layer} of branchesOf(f)){
    if(prev){const dn=el('div','down');dn.append(el('span',null,prev===layer?'↓':'↓ '+LAYERS[prev].n+' → '+LAYERS[layer].n));rows.append(dn)}
    prev=layer;
    const row=el('div','row'),br=el('div','branch');br.style.setProperty('--c','var('+LAYERS[layer].c+')');
    const t=el('div','t');t.append(document.createTextNode(b[0]));
    const bd=el('span','badge',LAYERS[layer].n);bd.style.setProperty('--c','var('+LAYERS[layer].c+')');t.append(bd);
    const cp=el('button','copy','複製');cp.type='button';cp.title='複製此群組的檔案路徑';cp.addEventListener('click',()=>copy(b[2].split(',').map(pathOf).join('\n')));t.append(cp);
    br.append(t,el('p',null,b[1]));
    const files=el('div','files');
    for(const file of b[2].split(',')){const a=el('a','file',pathOf(file));a.href=REPO+pathOf(file);a.title='開啟檔案';files.append(a)}
    row.append(br,files);rows.append(row);
  }
  bundle.append(rows);tree.append(bundle);
  const lg=el('div','legend');lg.append(document.createTextNode('依賴方向由上而下：'));
  for(const l of ['boot','front','logic','data','net','bc','verify']){const b=el('span','badge',LAYERS[l].n);b.style.setProperty('--c','var('+LAYERS[l].c+')');lg.append(b)}
  d.append(tree,lg);main.append(crumb,d);
}
function render(){renderNav();state.view==='overview'?renderOverview():renderFeature()}
function open(i){active=features[i];state.view='feature';try{history.replaceState(null,'','#f'+i)}catch{}window.scrollTo({top:0});render()}
$('#home').addEventListener('click',()=>{state.view='overview';state.query='';q.value='';try{history.replaceState(null,'','#')}catch{}render()});
q.addEventListener('input',()=>{state.query=q.value;state.view='overview';render()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q&&!e.metaKey&&!e.ctrlKey){e.preventDefault();q.focus()}
  else if(e.key==='Escape'&&document.activeElement===q){q.value='';state.query='';render();q.blur()}
});
const toast=$('#toast');let timer;
function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1400)}
async function copy(text){try{await navigator.clipboard.writeText(text);showToast('已複製路徑')}catch{showToast('無法存取剪貼簿')}}
const root=document.documentElement;
try{const s=localStorage.getItem('hsc-doc-theme');if(s)root.dataset.theme=s}catch{}
$('#theme').addEventListener('click',()=>{
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('hsc-doc-theme',root.dataset.theme)}catch{}
});
const m=/^#f(\d+)$/.exec(location.hash);
if(m&&features[Number(m[1])]){active=features[Number(m[1])];state.view='feature'}
render();
</script>
</body>
</html>
