<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AFC 功能分支圖</title><style>:root{color-scheme:dark;--a:#a56cff;--b:#17131e;--l:#665778}*{box-sizing:border-box}body{margin:0;background:#0d0b11;color:#f5f1fa;font:14px system-ui}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{padding:22px 14px;background:#121017;border-right:1px solid #352e40}h1{font-size:20px;margin:0 8px 16px}h2{margin:0 0 6px}input{width:100%;padding:10px;background:#0d0b11;border:1px solid #40364c;color:#fff;border-radius:7px}.g{margin:18px 8px 6px;color:#9f96aa;font-size:11px}button{color:#eee;background:transparent;border:0;cursor:pointer}.f{width:100%;padding:10px;text-align:left;border-radius:7px}.f:hover,.f.on{background:#2b2040;color:#d6c0ff}.main{padding:24px;min-width:0}.sub{color:#aaa1b4}.tree{margin-top:18px;padding:30px;min-height:560px;background:radial-gradient(circle at 20%,#20172c,#100e15 60%);border:1px solid #352d40;border-radius:12px;overflow:auto}.root,.branch,.file{padding:9px 11px;background:#211b2a;border:1px solid #493d57;border-left:4px solid var(--c,var(--a));border-radius:7px}.root{background:#382557}.bundle{display:grid;grid-template-columns:180px 220px minmax(280px,1fr);gap:70px;align-items:center;min-width:850px}.branches{display:grid;gap:16px}.row{display:grid;grid-template-columns:220px minmax(280px,1fr);gap:70px;align-items:center}.files{display:grid;gap:6px}.branch,.file{position:relative;text-align:left}.branch:before,.file:before{content:'';position:absolute;right:100%;top:50%;width:70px;border-top:2px solid var(--l)}.type{display:block;color:var(--c);font-size:10px}.detail{margin-top:14px;padding:14px;border-left:3px solid var(--a);background:var(--b)}code{color:#d9c8f5}@media(max-width:700px){.app{display:block}aside{position:static}.bundle{transform-origin:left top}.main{padding:15px}}</style></head><body><div class="app"><aside><h1>AFC 功能分支圖</h1><input id="q" placeholder="搜尋功能"><nav id="nav"></nav></aside><main class="main"><h2 id="title"></h2><div id="desc" class="sub"></div><section id="tree" class="tree"></section><div id="detail" class="detail"></div></main></div><script>
document.title='HSC 功能分支圖';document.querySelector('h1').textContent='HSC 功能分支圖';
const D=[['語音觸發流程','解析 Voice 訊息並依設定執行催眠效果',[['Core','命令與網路','core/commands.js,core/net.js'],['Runner','效果流程','effects/run.js'],['Hook','BC Hooks','core/hooks.js'],['State','設定與儲存','core/config.js,core/storage.js']]],['視覺效果','螺旋、暗角、波紋、扭曲與粉紅閃光',[['Effect','螺旋與波紋','effects/spiral.js,effects/waves.js'],['Effect','暗角與扭曲','effects/vignette.js,effects/distort.js'],['Effect','閃光與氣氛','effects/pink-flash.js,effects/atmosphere.js'],['Util','幾何與層級','util/geometry.js,util/zlayers.js']]],['角色與高潮效果','角色表情、呼吸、高潮、彈幕與狀態效果',[['Effect','角色 FX','effects/character-fx.js,effects/state-fx.js'],['Effect','呼吸與高潮','effects/breath.js,effects/climax.js'],['Effect','彈幕與人群','effects/danmaku.js,effects/crowd.js'],['Audio','聲音','effects/sound.js']]],['催眠控制','催眠動畫、Orb、說話控制與狀態管理',[['Hypno','核心狀態','hypno/hypno.js'],['Hypno','動畫與 Orb','hypno/hypno-anim.js,hypno/hypno-orb.js'],['Hypno','說話控制','hypno/hypno-speech.js']]],['控制介面','控制面板、偏好設定、Profile 與樣式',[['UI','控制面板','ui/panel.js'],['UI','偏好設定','ui/preference.js'],['UI','Profile','ui/profile.js'],['UI','樣式','ui/styles.js']]],['擴充整合','多語、主題色 API 與公開初始化',[['Core','初始化','main.js,app.js,core/core-init.js'],['i18n','多語','expansion/i18n.js,expansion/l10n.js,expansion/BC_i18n.js'],['API','主題色','expansion/theme-color-api.js']]]];
let A=D[0];const nav=document.querySelector('#nav'),tree=document.querySelector('#tree'),detail=document.querySelector('#detail');function list(q=''){nav.innerHTML='<div class=g>全部功能</div>';D.filter(x=>x.join().toLowerCase().includes(q.toLowerCase())).forEach(x=>{let b=document.createElement('button');b.className='f '+(x===A?'on':'');b.textContent=x[0];b.onclick=()=>{A=x;list(q);draw()};nav.append(b)})}function draw(){title.textContent=A[0];desc.textContent=A[1];tree.innerHTML=`<div class=bundle><div class=root>${A[0]}</div><div class=branches>${A[2].map(x=>`<div class=row><button class=branch style="--c:var(--a)" data-files="${x[2]}"><span class=type>${x[0]}</span>${x[1]}</button><div class=files>${x[2].split(',').map(f=>`<button class=file data-files="${f}"><span class=type>FILE</span>${f}</button>`).join('')}</div></div>`).join('')}</div></div>`;tree.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.textContent,b.dataset.files));show(A[0],A[2].flatMap(x=>x[2].split(',')).join(','))}function show(n,f){detail.innerHTML=`<b>${n}</b><br>${f.split(',').map(x=>`<code>src/${x}</code>`).join('　')}`}q.oninput=()=>list(q.value);list();draw();</script></body></html>
