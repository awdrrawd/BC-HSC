version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:06'
      timezone: Asia/Taipei
    # 新版本發布滿 7 天才提出更新 PR，避開被盜帳號發布、通常數小時到數天內就會被下架的惡意版本；安全性更新不受影響，仍會立即提出。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-compatible:
        patterns: ['*']
        update-types: [minor, patch]
    # major 升級維持各自獨立、可個別審查的 PR。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:06'
      timezone: Asia/Taipei
    # 新版本發布滿 7 天才提出更新 PR，避開被盜帳號發布、通常數小時到數天內就會被下架的惡意版本；安全性更新不受影響，仍會立即提出。
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 2
