name: HSC checks
# main 的檢查由 deploy.yml 以 workflow_call 呼叫，這裡不再重複監聽 push main。
on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: 上傳建置好的 dist/ 作為 Pages 產物（由 deploy.yml 使用）
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
# 同一個 PR 有新提交時取消舊檢查；main 的檢查不中斷（由 deploy.yml 呼叫）。
concurrency:
  group: hsc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: HSC checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:i18n
      # 正式依賴有 high 以上漏洞就失敗；開發工具的漏洞交給 Dependabot，不阻擋發布。
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      # deploy.yml 呼叫時直接上傳這次 lint → test → build 產生的 dist/，部署的就是通過檢查的同一份產物，不用再建置一次。
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.upload-pages
        with:
          path: dist/
