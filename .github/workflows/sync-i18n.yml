name: Manually sync shared i18n

# 手動從 liko-Plugin-Repository 同步共用 i18n 引擎：完整檢查通過後推到新分支，並在 Job Summary 附上建立 PR 的連結（不觸發部署）。
# 步驟在共用 workflow awdrrawd/Bondage-College-Mirror/.github/workflows/reusable-sync-i18n.yml。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-i18n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
    uses: awdrrawd/Bondage-College-Mirror/.github/workflows/reusable-sync-i18n.yml@main
